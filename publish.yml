name: Refresh and publish Market Terminal

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '37 8,15,21 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified financial source cache
        uses: actions/cache@v4
        with:
          path: |
            .terminal_filings
            .terminal_research
            .terminal_sources
          key: primary-sources-v21-${{ github.run_id }}
          restore-keys: primary-sources-v21-

      - name: Install financial data client
        run: python -m pip install 'yfinance>=0.2.55,<1' 'xlrd>=2.0.1,<3'

      - name: Test calculations before using them
        run: |
          python test_etf_tracker.py
          python test_gilt_model.py
          python test_equity_research.py
          python test_research_release1.py
          python test_shell_live_validation.py
          python test_research_release2.py
          python test_research_release21.py
          python test_release22.py

      - name: Download data and build terminal
        run: >-
          python build_terminal.py --years 10
          --workers 2 --cache-hours 0
          --movers-markets FTSE100,FTSE250,SP500,NASDAQ100
          --mover-history-limit 30
          --company-news-limit 20
          --price-history-batch 60
          --companies AXON,CCH.L,SHAW.L,NFLX
          --output terminal.html

      - name: Verify actual published research payload
        run: python verify_live_research.py terminal.html

      - name: Upload production source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-source-diagnostics
          path: |
            .terminal_sources/dmo_verification.json
            terminal.sources.json
            .terminal_sources/requests.jsonl

      - name: DMO freshness diagnostics (independent of other market publication)
        continue-on-error: true
        run: python verify_dmo.py --existing

      - name: Check market data
        run: python verify_snapshot.py terminal.html

      - name: Research layout and after-tax gilt comparison
        run: python terminal_research_upgrade.py terminal.html

      - name: Market analysis, economics and data quality
        run: python market_terminal_cleanup.py --post --html terminal.html

      - name: Email alerts (private; rules held in repository secrets)
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_PASSWORD: ${{ secrets.ALERT_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_RULES: ${{ secrets.ALERT_RULES }}
          ALERT_TAX_RATE: ${{ secrets.ALERT_TAX_RATE }}
          ALERT_SMTP: ${{ secrets.ALERT_SMTP }}
        run: python alerts.py terminal.html public

      - name: Prepare website and persistent cache
        run: |
          mkdir -p public
          cp terminal.html public/index.html
          if test -f .terminal_fundamentals/fundamental_summaries.json; then
            cp .terminal_fundamentals/fundamental_summaries.json public/fundamentals_cache.json
          fi
          python market_price_history.py --publish public
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
