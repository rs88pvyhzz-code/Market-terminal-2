name: Official DMO quotation freshness
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '45 8,15,21 * * 1-5'
permissions:
  contents: read
jobs:
  dmo-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'xlrd>=2.0.1,<3'
      - name: Download genuinely fresh official DMO prices and validate yields
        run: python verify_dmo.py
      - name: Upload quotation-date and retrieval diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-dmo-freshness
          include-hidden-files: true
          path: |
            .terminal_sources/dmo_verification.json
            .terminal_dmo_latest.json
