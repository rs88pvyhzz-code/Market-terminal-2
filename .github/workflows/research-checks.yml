name: Research regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'xlrd>=2.0.1,<3'
      - run: python test_etf_tracker.py
      - run: python test_gilt_model.py
      - run: python test_equity_research.py
      - run: python test_research_release1.py
      - run: python test_shell_live_validation.py
      - run: python test_research_release2.py
      - run: python test_research_release21.py
      - run: python test_release22.py
      - run: python test_market_briefing.py
      - run: python build_terminal.py --demo --output /tmp/research-demo.html
      - run: python terminal_research_upgrade.py /tmp/research-demo.html
      - run: python market_terminal_cleanup.py --post --html /tmp/research-demo.html
      - name: Install browser test runner
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser regression with sourced fixtures
        run: |
          python tests/browser_research_release1.py /tmp/research-demo.html
          python tests/browser_research_release2.py /tmp/research-demo.html
          python tests/browser_release22.py /tmp/research-demo.html
          python tests/browser_market_briefing.py /tmp/research-demo.html
          python tests/browser_release24.py /tmp/research-demo.html
          python tests/browser_release25.py /tmp/research-demo.html
          python tests/browser_release26.py /tmp/research-demo.html
          python tests/browser_treasury_scroll.py /tmp/research-demo.html
      - name: Upload review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: company-research-release1-screenshots
          path: |
            /tmp/research-r1-*.png
            /tmp/research-r2-*.png
            /tmp/release22-*.png
            /tmp/release23-*.png
            /tmp/release24-*.png
            /tmp/release25-*.png
            /tmp/release26-*.png
