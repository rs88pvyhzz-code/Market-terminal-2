name: Research regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'xlrd>=2.0.1,<3'
      - name: Script syntax
        run: for f in *.js; do node --check "$f"; done
      - name: Calculation tests
        run: python run_tests.py
      - name: Build synthetic terminal through the production pipeline
        run: python build_site.py --demo --output /tmp/research-demo.html
      - name: Install browser test runner
        run: |
          python -m pip install playwright
          # Ubuntu hosted runners already include Google Chrome. Avoid apt
          # dependency downloads: the November runner's Azure Ubuntu mirror
          # failed DNS resolution and stopped the tests before browser startup.
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            # Download only Playwright Chromium; do not invoke apt on the
            # transiently unavailable mirror.
            python -m playwright install chromium
          fi
      - name: Browser regression with sourced fixtures
        run: python tests/run_browser.py --demo /tmp/research-demo.html
      - name: Upload review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: company-research-release1-screenshots
          path: |
            /tmp/research-r1-*.png
            /tmp/research-r2-*.png
            /tmp/release22-*.png
            /tmp/release23-*.png
            /tmp/release24-*.png
            /tmp/release25-*.png
            /tmp/release26-*.png
            /tmp/release27-*.png
            /tmp/release27-visual-verification.json
            /tmp/release210-*.png
            /tmp/release211-*.png
            /tmp/release212-*.png
