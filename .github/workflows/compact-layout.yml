name: Compact layout visual checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright 'xlrd>=2.0.1,<3'
      - name: Select installed browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install chromium
          fi
      - name: Build through production presentation pipeline
        run: python build_site.py --demo --output /tmp/compact-demo.html
      - name: Compact presentation and retained layout checks
        run: |
          python tests/browser_compact.py /tmp/compact-demo.html
          python tests/browser_market_tables.py /tmp/compact-demo.html
          python tests/browser_layout.py /tmp/compact-demo.html
          python tests/browser_release212.py /tmp/compact-demo.html
          python tests/browser_release22.py /tmp/compact-demo.html
      - name: Load existing production snapshot for visual regression
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43328200450
          name: actual-terminal-source-verification
          path: /tmp/archived-production
      - name: Verify current layout against unchanged production data
        run: |
          python tests/rebuild_snapshot.py /tmp/archived-production /tmp/compact-production.html
          python tests/browser_compact.py /tmp/compact-production.html
          python tests/browser_market_tables.py /tmp/compact-production.html
          python tests/browser_layout.py /tmp/compact-production.html
          python tests/browser_treasury_scroll.py /tmp/compact-production.html
      - name: Review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-layout-screenshots
          path: /tmp/compact-*.png
