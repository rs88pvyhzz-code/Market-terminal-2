name: Refresh and publish Market Terminal

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '37 8,15,21 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified financial source cache
        uses: actions/cache@v4
        with:
          path: |
            .terminal_filings
            .terminal_research
            .terminal_sources
          key: primary-sources-v21-${{ github.run_id }}
          restore-keys: primary-sources-v21-

      - name: Install financial data client
        run: python -m pip install 'yfinance>=0.2.55,<1' 'xlrd>=2.0.1,<3'

      - name: Test calculations before using them
        run: python run_tests.py

      # One command: build, verify, post-process and apply the tab layout.
      # The order lives in build_site.py so the three workflows cannot drift apart.
      - name: Build and verify terminal
        run: >-
          python build_site.py --output terminal.html --verify --
          --years 10
          --workers 2 --cache-hours 0
          --movers-markets FTSE100,FTSE250,SP500,NASDAQ100,DOW,DAX,CAC40,SMI,HSI,NIKKEI225
          --mover-history-limit 30
          --company-news-limit 20
          --price-history-batch 60
          --companies AXON,CCH.L,SHAW.L,NFLX

      - name: Upload production source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-source-diagnostics
          path: |
            .terminal_sources/dmo_verification.json
            terminal.sources.json
            public/news_verification.json
            .terminal_sources/requests.jsonl

      - name: Prepare website and persistent cache
        run: |
          mkdir -p public
          cp terminal.html public/index.html
          if test -f .terminal_fundamentals/fundamental_summaries.json; then
            cp .terminal_fundamentals/fundamental_summaries.json public/fundamentals_cache.json
          fi
          python market_price_history.py --publish public
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
